name: test
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peruri
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: peruri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peruri -d peruri_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://peruri:test_only@localhost:5432/peruri_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l docs cmd internal db test)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=10 ./...
